name: Scraper de beneficios

# Corre TODOS los bancos de una sola vez.
on:
  schedule:
    - cron: '0 11 * * 1'   # lunes 08:00 en Paraguay (UTC-3)
  workflow_dispatch:        # y el botón "Run workflow" para correrlo cuando quieras
    inputs:
      simulacion:
        description: 'Simulación: lee todo y muestra qué cambiaría, sin tocar beneficios'
        type: boolean
        default: false

jobs:
  scrapear:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # `shell: bash` activa pipefail: sin eso, `node ... | tee` deja el paso
        # en verde aunque node haya fallado (nos pasó en la corrida #2).
        shell: bash
        working-directory: scripts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Instalar dependencias
        run: npm ci || npm install

      # Ya no se instala Chrome headless: GNB pasó a leerse por su API y hoy
      # ningún scraper usa navegador. Si vuelve a hacer falta (Itaú), reponer:
      #   - run: npx playwright install --with-deps chromium

      # Siempre se escribe staging_scrape: es una tabla de trabajo, se pisa en cada
      # corrida y no la ve nadie desde la app.
      - name: Leer todos los bancos
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node run-all.js | tee $GITHUB_STEP_SUMMARY

      # En simulación el diff reporta qué haría y no toca `beneficios`.
      - name: Aplicar cambios seguros y encolar el resto
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node apply-diff.js ${{ inputs.simulacion == true && '--dry-run' || '' }} | tee -a $GITHUB_STEP_SUMMARY
